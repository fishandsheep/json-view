<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editor | JSON Crack</title>
    <meta
      name="description"
      content="JSON Crack Editor is a tool for visualizing into graphs, analyzing, editing, formatting, querying, transforming and validating JSON, CSV, YAML, XML, and more."
    />
    <meta name="theme-color" content="#262626" />
    <meta property="og:title" content="Editor | JSON Crack" />
    <meta
      property="og:description"
      content="Visualize JSON into interactive graphs. Analyze, edit, format, query, transform and validate JSON, CSV, YAML, XML."
    />
    <meta property="og:type" content="website" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d6dfe'/%3E%3Cpath d='M10 12.5C10 10 12 8 14.5 8c1.8 0 3.2.9 4 2.3.8-1.4 2.2-2.3 4-2.3C25 8 27 10 27 12.5c0 5.5-8.5 11-8.5 11s-8.5-5.5-8.5-11z' fill='%23fff' transform='scale(0.9) translate(1.5 0)'/%3E%3C/svg%3E"
    />
    <script>
      // Apply persisted theme before first paint to avoid a flash of wrong theme.
      // The config store persists to `jsoncrack-config`; read that same entry so
      // there is only one source of truth. `jsoncrack-theme` is a legacy key.
      // try/catch: storage access can throw in restricted embedding contexts.
      try {
        var configured = null;
        var raw = localStorage.getItem("jsoncrack-config");
        if (raw) {
          try {
            var saved = JSON.parse(raw);
            if (saved && saved.state && typeof saved.state.darkmodeEnabled === "boolean") {
              configured = saved.state.darkmodeEnabled;
            }
          } catch (ignored) {}
        }
        var legacy = localStorage.getItem("jsoncrack-theme");
        var theme =
          configured === true
            ? "dark"
            : configured === false
              ? "light"
              : legacy === "light" || legacy === "dark"
                ? legacy
                : matchMedia("(prefers-color-scheme: light)").matches
                  ? "light"
                  : "dark";
        document.documentElement.dataset.theme = theme;
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
